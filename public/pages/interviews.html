<!DOCTYPE html lang="es">
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobConnect – Entrevistas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="../vendor/sweetalert2/sweetalert2.min.css">
</head>
<body>
    <header class="topbar" id="topbar" role="banner">
        <div class="topbar-left">
            <button class="sidebar-toggle" id="sidebarToggle" title="Abrir/cerrar menú" aria-label="Abrir menú lateral" aria-expanded="false" aria-controls="sidebar"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
            <div class="logo" aria-label="JobConnect"><svg class="logo-mark" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>JobConnect</div>
        </div>
        <nav class="topbar-right" id="topbarNav" aria-label="Opciones globales">
            <div class="a11y-wrapper" style="position:relative;"><button id="a11yToggleBtn" class="btn-icon" title="Modo Accesibilidad" aria-label="Ajuste daltónico" aria-expanded="false" aria-haspopup="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2v20"/><path d="M2 12h10"/><path d="M12 6a6 6 0 0 1 0 12"/></svg></button><div id="a11yDropdown" class="a11y-dropdown hidden" role="menu"><p class="a11y-title">Ajuste Daltónico</p><button class="a11y-option active" data-mode="normal" role="menuitem">Normal</button><button class="a11y-option" data-mode="deuteranopia" role="menuitem">Deuteranopía / Protanopía</button><button class="a11y-option" data-mode="tritanopia" role="menuitem">Tritanopía</button><button class="a11y-option" data-mode="monochrome" role="menuitem">Alto Contraste</button></div></div>
            <button id="themeToggleBtn" class="btn-icon" title="Cambiar tema"><svg id="themeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
            <button id="langToggleBtn" class="btn-icon" title="Cambiar idioma"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg><span class="lang-label" data-i18n="lang.code">ES</span></button>
            <button id="logoutBtn" class="btn btn-secondary" aria-label="Cerrar sesión"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span data-i18n="topbar.logout">Cerrar Sesión</span></button>
        </nav>
    </header>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar" aria-label="Menú lateral">
            <nav>
                <a href="/dashboard" class="sidebar-btn" data-page="dashboard">PRINCIPAL</a>
                <a href="/companies" class="sidebar-btn" data-page="companies">MÓDULOS</a>
                <a href="/vacancies" class="sidebar-btn" data-page="vacancies">Vacantes</a>
                <a href="/interviews" class="sidebar-btn active" data-page="interviews" aria-current="page">Entrevistas</a>
                <a href="/candidates" class="sidebar-btn" data-page="candidates">Candidatos</a>
                <a href="/applications" class="sidebar-btn" data-page="applications">Postulaciones</a>
                <a href="/tasks" class="sidebar-btn" data-page="tasks">Tareas</a>
                <a href="/tracking" class="sidebar-btn" data-page="tracking">Seguimiento</a>
                <a href="/profile" class="sidebar-btn" data-page="profile">Mi Perfil</a>
                <a href="/my-applications" class="sidebar-btn" data-page="my-applications">Mis Postulaciones</a>
            </nav>
        </aside>

        <main class="main-content" id="mainContent">
        <section id="interviewsSection" class="view-section" aria-label="Módulo de entrevistas">
            <div class="page-header">
                <div><h1>Entrevistas / Notas</h1><p>Gestión del recurso /comments</p></div>
                <button class="btn btn-primary fab-btn" id="btnNewInterview" aria-label="Crear nueva entrevista">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                    Nueva Entrevista
                </button>
            </div>
            <div class="module-toolbar" role="search" aria-label="Filtrar entrevistas">
                <label class="search-field"><span class="sr-only">Buscar entrevista</span><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="interviewsSearch" type="search" placeholder="Buscar por candidato o notas..." autocomplete="off"></label>
                <label><span class="sr-only">Filtrar por vacante</span><select id="interviewsVacancyFilter"><option value="">Todas las vacantes</option></select></label>
                <label><span class="sr-only">Filtrar por modalidad</span><select id="interviewsModalityFilter"><option value="">Todas las modalidades</option><option value="Google Meet">Google Meet</option><option value="Zoom">Zoom</option><option value="Presencial">Presencial</option><option value="Teams">Teams</option></select></label>
                <label><span class="sr-only">Filtrar por estado</span><select id="interviewsStatusFilter"><option value="">Todos los estados</option><option value="Programada">Programada</option><option value="Completada">Completada</option><option value="Cancelada">Cancelada</option></select></label>
                <label><span class="sr-only">Filtrar desde fecha</span><input id="interviewsDateFilter" type="date" title="Entrevistas desde"></label>
                <button class="btn btn-ghost module-clear" id="interviewsClearFilters" type="button">Limpiar</button>
            </div>
            <div class="table-card">
                <div class="loader-container hidden" id="interviewsLoader" role="status" aria-live="polite"><span class="spinner" aria-hidden="true"></span> Cargando entrevistas...</div>
                <div class="table-container">
                    <table class="data-table" id="interviewsTable" aria-label="Lista de entrevistas">
                        <thead><tr><th scope="col">ID</th><th scope="col">Candidato / Vacante</th><th scope="col">Entrevistador</th><th scope="col">Fecha y modalidad</th><th scope="col">Acciones</th></tr></thead>
                        <tbody id="interviewsTbody"></tbody>
                    </table>
                </div>
            </div>
        </section>
    </main>
    </div>

    <div class="modal hidden" id="interviewModal" role="dialog" aria-modal="true" aria-labelledby="interviewModalTitle">
        <div class="modal-content card">
            <h2 id="interviewModalTitle">Entrevista / Nota</h2>
            <form id="interviewForm" novalidate>
                <input type="hidden" id="interviewId">
                <div class="form-group"><label for="interviewBody">Nota / Observaciones <span aria-hidden="true">*</span></label><input type="text" id="interviewBody" required aria-required="true" placeholder="Ej. Candidato con excelente perfil técnico..."></div>
                <div class="form-group"><label for="interviewUserId">ID Candidato <span aria-hidden="true">*</span></label><input type="number" id="interviewUserId" required aria-required="true" min="1" placeholder="Ej. 1"></div>
                <div class="form-group"><label for="interviewPostId">ID Postulación <span aria-hidden="true">*</span></label><input type="number" id="interviewPostId" required aria-required="true" min="1" placeholder="Ej. 1"></div>
                <div class="modal-actions"><button type="button" class="btn btn-ghost" id="cancelInterviewBtn">Cancelar</button><button type="submit" class="btn btn-primary">Guardar</button></div>
            </form>
        </div>
    </div>

    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="../vendor/sweetalert2/sweetalert2.min.js"></script>
    <script type="module" src="../js/app-page.js"></script>
</body>
</html>
