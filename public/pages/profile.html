<!DOCTYPE html lang="es">
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobConnect – Mi Perfil</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="../vendor/sweetalert2/sweetalert2.min.css">
</head>
<body>
    <header class="topbar" id="topbar" role="banner">
        <div class="topbar-left">
            <button class="sidebar-toggle" id="sidebarToggle" title="Abrir/cerrar menú" aria-label="Abrir menú lateral" aria-expanded="false" aria-controls="sidebar"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
            <div class="logo" aria-label="JobConnect"><svg class="logo-mark" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>JobConnect</div>
        </div>
        <nav class="topbar-right" id="topbarNav" aria-label="Opciones globales">
            <div class="a11y-wrapper" style="position:relative;"><button id="a11yToggleBtn" class="btn-icon" title="Modo Accesibilidad" aria-label="Ajuste daltónico" aria-expanded="false" aria-haspopup="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2v20"/><path d="M2 12h10"/><path d="M12 6a6 6 0 0 1 0 12"/></svg></button><div id="a11yDropdown" class="a11y-dropdown hidden" role="menu"><p class="a11y-title">Ajuste Daltónico</p><button class="a11y-option active" data-mode="normal" role="menuitem">Normal</button><button class="a11y-option" data-mode="deuteranopia" role="menuitem">Deuteranopía / Protanopía</button><button class="a11y-option" data-mode="tritanopia" role="menuitem">Tritanopía</button><button class="a11y-option" data-mode="monochrome" role="menuitem">Alto Contraste</button></div></div>
            <button id="themeToggleBtn" class="btn-icon" title="Cambiar tema"><svg id="themeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
            <button id="langToggleBtn" class="btn-icon" title="Cambiar idioma"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg><span class="lang-label" data-i18n="lang.code">ES</span></button>
            <button id="logoutBtn" class="btn btn-secondary" aria-label="Cerrar sesión"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg><span data-i18n="topbar.logout">Cerrar Sesión</span></button>
        </nav>
    </header>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar" aria-label="Menú lateral">
            <nav>
                <a href="/dashboard" class="sidebar-btn" data-page="dashboard">PRINCIPAL</a>
                <a href="/companies" class="sidebar-btn" data-page="companies">MÓDULOS</a>
                <a href="/vacancies" class="sidebar-btn" data-page="vacancies">Vacantes</a>
                <a href="/interviews" class="sidebar-btn" data-page="interviews">Entrevistas</a>
                <a href="/candidates" class="sidebar-btn" data-page="candidates">Candidatos</a>
                <a href="/applications" class="sidebar-btn" data-page="applications">Postulaciones</a>
                <a href="/tasks" class="sidebar-btn" data-page="tasks">Tareas</a>
                <a href="/tracking" class="sidebar-btn" data-page="tracking">Seguimiento</a>
                <a href="/profile" class="sidebar-btn active" data-page="profile" aria-current="page">Mi Perfil</a>
                <a href="/my-applications" class="sidebar-btn" data-page="my-applications">Mis Postulaciones</a>
            </nav>
        </aside>

        <main class="main-content" id="mainContent">
        <section id="profileSection" class="view-section" aria-label="Mi perfil">
            <div class="page-header">
                <div><p class="eyebrow">MI CUENTA / PERFIL</p><h1 data-i18n="profile.title">Mi Perfil</h1><p data-i18n="profile.subtitle">Administra tu información personal y profesional</p></div>
            </div>
            <div class="profile-card">
                <div class="profile-header">
                    <div class="profile-avatar" id="profileAvatar">--</div>
                    <div class="profile-header-info"><h2 id="profileDisplayName">Candidato</h2><p id="profileDisplayRole">Rol profesional</p></div>
                </div>
                <form id="profileForm" novalidate>
                    <div class="profile-form">
                        <div class="form-group"><label for="profileFirstName" data-i18n="profile.firstName">Nombre</label><input type="text" id="profileFirstName" placeholder="Tu nombre"></div>
                        <div class="form-group"><label for="profileLastName" data-i18n="profile.lastName">Apellido</label><input type="text" id="profileLastName" placeholder="Tu apellido"></div>
                        <div class="form-group"><label for="profileEmail" data-i18n="profile.email">Correo electrónico</label><input type="email" id="profileEmail" placeholder="correo@ejemplo.com"></div>
                        <div class="form-group"><label for="profilePhone" data-i18n="profile.phone">Teléfono</label><input type="tel" id="profilePhone" placeholder="+52 55 0000 0000"></div>
                        <div class="form-group"><label for="profileTitle" data-i18n="profile.titleField">Título profesional</label><input type="text" id="profileTitle" placeholder="Ej. Frontend Developer"></div>
                        <div class="form-group"><label for="profileLocation" data-i18n="profile.location">Ubicación</label><input type="text" id="profileLocation" placeholder="Ciudad de México"></div>
                        <div class="form-group full-width"><label for="profileSummary" data-i18n="profile.summary">Resumen profesional</label><textarea id="profileSummary" rows="3" placeholder="Breve descripción de tu experiencia y habilidades..."></textarea></div>
                        <div class="form-group"><label for="profileLinkedin" data-i18n="profile.linkedin">LinkedIn URL</label><input type="url" id="profileLinkedin" placeholder="https://linkedin.com/in/tu-perfil"></div>
                        <div class="form-group"><label for="profileGithub" data-i18n="profile.github">GitHub URL</label><input type="url" id="profileGithub" placeholder="https://github.com/tu-usuario"></div>
                        <div class="form-group"><label for="profilePortfolio" data-i18n="profile.portfolio">Portafolio URL</label><input type="url" id="profilePortfolio" placeholder="https://tu-portafolio.com"></div>
                        <div class="form-group"><label for="profileCvUrl" data-i18n="profile.cvUrl">URL del CV</label><input type="url" id="profileCvUrl" placeholder="https://example.com/cv.pdf"></div>
                        <div class="form-group full-width">
                            <label data-i18n="profile.skills">Habilidades</label>
                            <div class="profile-skills" id="profileSkills"></div>
                            <div style="display:flex; gap:8px; margin-top:8px;">
                                <input type="text" id="profileSkillInput" placeholder="Agregar habilidad..." style="flex:1;">
                                <button type="button" class="btn btn-ghost" id="profileAddSkillBtn" data-i18n="profile.addSkill">Agregar</button>
                            </div>
                        </div>
                    </div>
                    <div class="profile-actions"><button type="submit" class="btn btn-primary" data-i18n="profile.save">Guardar cambios</button></div>
                </form>
            </div>
        </section>
    </main>
    </div>

    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script src="../vendor/sweetalert2/sweetalert2.min.js"></script>
    <script type="module" src="../js/app-page.js"></script>
</body>
</html>
