<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="JobConnect – Portal corporativo de gestión de talento, vacantes y entrevistas.">
    <title>JobConnect – Iniciar Sesión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style/style.css">
    <link rel="stylesheet" href="../vendor/driver.js/driver.css">
    <link rel="stylesheet" href="../style/driver-overrides.css">
</head>
<body>

    <!-- TOPBAR -->
    <header class="topbar" id="topbar" role="banner">
        <div class="topbar-left">
            <div class="logo" aria-label="JobConnect">
                <svg class="logo-mark" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
                    <path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                </svg>
                JobConnect
            </div>
        </div>
        <nav class="topbar-right" id="topbarNav" aria-label="Opciones globales">
            <button id="themeToggleBtn" class="btn-icon" title="Cambiar tema" aria-label="Cambiar entre tema claro y oscuro">
                <svg id="themeIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                </svg>
            </button>
            <button id="langToggleBtn" class="btn-icon" title="Cambiar idioma" aria-label="Cambiar idioma del portal">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="2" y1="12" x2="22" y2="12"/>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                </svg>
                <span class="lang-label" data-i18n="lang.code">ES</span>
            </button>
            <a href="/" class="btn btn-ghost" aria-label="Volver al inicio">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
                <span>Volver</span>
            </a>
        </nav>
    </header>

    <!-- LOGIN -->
    <section id="loginSection" class="login-wrapper" aria-label="Iniciar sesión">
        <canvas id="loginCanvas" aria-hidden="true"></canvas>
        <div class="login-card" role="region" aria-label="Formulario de acceso">
            <!-- Screen: Role Selector -->
            <div id="loginRoleSelect">
                <div class="login-brand">
                    <span class="login-logo">
                        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
                            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                        JobConnect
                    </span>
                    <p data-i18n="login.subtitle">Portal Corporativo</p>
                </div>
                <h2 data-i18n="login.selectRole">¿Quién eres?</h2>
                <p class="role-select-hint" data-i18n="login.selectRoleHint">Selecciona tu perfil para continuar</p>
                <div class="role-grid">
                    <button class="role-card" data-role="candidato" type="button">
                        <span class="role-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                        </span>
                        <strong>Candidato</strong>
                        <small>Busco empleo</small>
                    </button>
                    <button class="role-card" data-role="empresa" type="button">
                        <span class="role-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V7l9-4 9 4v14"/><path d="M9 21v-8h6v8"/><path d="M3 7h18"/></svg>
                        </span>
                        <strong>Empresa</strong>
                        <small>Contrato talento</small>
                    </button>
                    <button class="role-card" data-role="reclutador" type="button">
                        <span class="role-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        </span>
                        <strong>Reclutador</strong>
                        <small>Gestiono candidatos</small>
                    </button>
                    <button class="role-card" data-role="administrador" type="button">
                        <span class="role-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                        </span>
                        <strong>Administrador</strong>
                        <small>Control total</small>
                    </button>
                </div>
            </div>

            <!-- Screen: Login Form -->
            <div id="loginFormScreen" class="hidden">
                <button class="btn-back-role" id="btnBackToRoles" type="button" aria-label="Volver a selección de rol">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
                    Volver
                </button>
                <div class="login-brand">
                    <span class="login-logo">
                        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
                            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                        JobConnect
                    </span>
                    <p id="loginRoleLabel" class="login-role-badge">Candidato</p>
                </div>
                <h2 data-i18n="login.title">Iniciar Sesión</h2>
                <form id="loginForm" novalidate aria-label="Formulario de inicio de sesión">
                    <div class="form-group">
                        <label for="username" data-i18n="login.user">USUARIO</label>
                        <div class="input-wrap">
                            <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            <input type="text" id="username" name="username" placeholder="emilys" required autocomplete="username" aria-required="true" aria-describedby="usernameError">
                        </div>
                        <span class="error-msg" id="usernameError" role="alert" aria-live="polite"></span>
                    </div>
                    <div class="form-group">
                        <label for="password" data-i18n="login.pass">CONTRASEÑA</label>
                        <div class="input-wrap">
                            <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                            <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password" aria-required="true" aria-describedby="passwordError">
                        </div>
                        <span class="error-msg" id="passwordError" role="alert" aria-live="polite"></span>
                    </div>
                    <label class="remember-row">
                        <input type="checkbox" id="rememberMe" name="rememberMe">
                        <span class="remember-check" aria-hidden="true"></span>
                        <span data-i18n="login.remember">Recordar usuario</span>
                    </label>
                    <button type="submit" class="btn btn-primary btn-login full-width" id="loginSubmitBtn">
                        <span class="btn-text" data-i18n="login.btn">Ingresar</span>
                        <span class="loader hidden" aria-label="Cargando..." role="status"></span>
                    </button>
                </form>
                <div id="loginAlert" class="alert hidden" role="alert" aria-live="assertive"></div>
                <div class="login-links">
                    <button type="button" class="btn-link" id="btnGoToRegister" data-i18n="login.noAccount">¿No tienes cuenta? Registrarse</button>
                </div>
                <div class="demo-users-section">
                    <p class="demo-title" data-i18n="login.demoTitle">Usuarios de demo</p>
                    <div class="demo-buttons">
                        <button type="button" class="btn-demo" data-demo-role="candidato" data-demo-user="emilys" data-demo-pass="emilyspass" title="emilys">
                            <span class="demo-avatar">C</span>
                            <span class="demo-info"><strong>Candidato</strong><small>emilys</small></span>
                        </button>
                        <button type="button" class="btn-demo" data-demo-role="empresa" data-demo-user="sophiaw" data-demo-pass="sophiawpass" title="sophiaw">
                            <span class="demo-avatar">E</span>
                            <span class="demo-info"><strong>Empresa</strong><small>sophiaw</small></span>
                        </button>
                        <button type="button" class="btn-demo" data-demo-role="reclutador" data-demo-user="james" data-demo-pass="jamespass" title="james">
                            <span class="demo-avatar">R</span>
                            <span class="demo-info"><strong>Reclutador</strong><small>james</small></span>
                        </button>
                        <button type="button" class="btn-demo" data-demo-role="administrador" data-demo-user="oliviab" data-demo-pass="oliviabpass" title="oliviab">
                            <span class="demo-avatar">A</span>
                            <span class="demo-info"><strong>Admin</strong><small>oliviab</small></span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Screen: Register Form -->
            <div id="registerScreen" class="hidden">
                <button class="btn-back-role" id="btnBackToLogin" type="button" aria-label="Volver al login">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
                    Volver
                </button>
                <div class="login-brand">
                    <span class="login-logo">
                        <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
                            <path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
                        </svg>
                        JobConnect
                    </span>
                </div>
                <h2 data-i18n="register.title">Crear Cuenta</h2>
                <form id="registerForm" novalidate aria-label="Formulario de registro">
                    <div class="form-group">
                        <label for="regRole" data-i18n="register.role">ROL</label>
                        <select id="regRole" name="regRole" required aria-required="true">
                            <option value="candidato" data-i18n="role.candidato">Candidato</option>
                            <option value="empresa" data-i18n="role.empresa">Empresa</option>
                            <option value="reclutador" data-i18n="role.reclutador">Reclutador</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="regUsername" data-i18n="register.username">USUARIO</label>
                        <div class="input-wrap">
                            <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                            <input type="text" id="regUsername" name="regUsername" placeholder="mi_usuario" required autocomplete="username" aria-required="true">
                        </div>
                        <span class="error-msg" id="regUsernameError" role="alert" aria-live="polite"></span>
                    </div>
                    <div class="form-group">
                        <label for="regEmail" data-i18n="register.email">CORREO</label>
                        <div class="input-wrap">
                            <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
                            <input type="email" id="regEmail" name="regEmail" placeholder="correo@ejemplo.com" required autocomplete="email" aria-required="true">
                        </div>
                        <span class="error-msg" id="regEmailError" role="alert" aria-live="polite"></span>
                    </div>
                    <div class="form-group">
                        <label for="regPassword" data-i18n="register.password">CONTRASEÑA</label>
                        <div class="input-wrap">
                            <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                            <input type="password" id="regPassword" name="regPassword" placeholder="••••••••" required autocomplete="new-password" aria-required="true">
                        </div>
                        <span class="error-msg" id="regPasswordError" role="alert" aria-live="polite"></span>
                    </div>
                    <div class="form-group">
                        <label for="regConfirmPassword" data-i18n="register.confirmPassword">CONFIRMAR CONTRASEÑA</label>
                        <div class="input-wrap">
                            <svg class="input-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                            <input type="password" id="regConfirmPassword" name="regConfirmPassword" placeholder="••••••••" required autocomplete="new-password" aria-required="true">
                        </div>
                        <span class="error-msg" id="regConfirmPasswordError" role="alert" aria-live="polite"></span>
                    </div>
                    <button type="submit" class="btn btn-primary btn-login full-width" id="registerSubmitBtn">
                        <span class="btn-text" data-i18n="register.btn">Crear Cuenta</span>
                        <span class="loader hidden" aria-label="Cargando..." role="status"></span>
                    </button>
                </form>
                <div id="registerAlert" class="alert hidden" role="alert" aria-live="assertive"></div>
                <div class="login-links">
                    <button type="button" class="btn-link" id="btnBackToLoginFromReg" data-i18n="login.hasAccount">¿Ya tienes cuenta? Iniciar sesión</button>
                </div>
            </div>
        </div>
    </section>

    <div id="toastContainer" class="toast-container" aria-live="polite" aria-atomic="false"></div>

    <script src="../vendor/sweetalert2/sweetalert2.min.js"></script>
    <script src="../vendor/driver.js/driver.js"></script>
    <script type="module" src="../js/login-page.js"></script>
</body>
</html>
